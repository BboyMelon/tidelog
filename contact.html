<div class="simple-page">
  <h1>聯絡我們</h1>
  <p class="lead">浪點資訊有誤、想分享更多衝浪大小事，都歡迎寫信給我們。</p>

  <div class="contact-info">
    <span>📧 tidelog.surf@gmail.com</span>
  </div>

  <form class="contact-form" id="contact-form">
    <div class="form-field">
      <label for="c-name">姓名</label>
      <input id="c-name" name="姓名" type="text" required>
    </div>
    <div class="form-field">
      <label for="c-email">Email</label>
      <input id="c-email" name="Email" type="email" required>
    </div>
    <div class="form-field">
      <label for="c-msg">訊息</label>
      <textarea id="c-msg" name="訊息" required></textarea>
    </div>
    <button class="btn primary form-submit" type="submit">送出</button>
    <p class="form-note" id="contact-status" hidden></p>
  </form>

  <p class="form-note">感謝您的回饋與建議，我們會盡快回覆您；若表單暫時無法送出，也歡迎直接寫信到 tidelog.surf@gmail.com。</p>
</div>

<script>
document.getElementById('contact-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var form = e.target;
  var status = document.getElementById('contact-status');
  var payload = {
    name: document.getElementById('c-name').value,
    email: document.getElementById('c-email').value,
    message: document.getElementById('c-msg').value,
  };
  fetch("https://surf-robot.onrender.com/api/contact", {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      status.hidden = false;
      status.textContent = data.ok ? '✅ ' + data.message : '❌ ' + data.message;
      if (data.ok) form.reset();
    })
    .catch(function () {
      status.hidden = false;
      status.textContent = '送出失敗，請直接寫信到 tidelog.surf@gmail.com';
    });
});
</script>
